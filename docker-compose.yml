version: '3.8'

services:
  deployer-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deployer-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEPLOYER_API_KEY=${DEPLOYER_API_KEY:-your_secret_deployer_api_key}
      - ALLOW_INSECURE_DEV=${ALLOW_INSECURE_DEV:-false}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,https://deployer.sammcore.local
      - DATA_DIR=/data
      - SUPABASE_HOST=${SUPABASE_HOST:-192.168.68.107}
      - SUPABASE_PORT=${SUPABASE_PORT:-5432}
      - SUPABASE_POSTGRES_PASSWORD=${SUPABASE_POSTGRES_PASSWORD:-your_postgres_password}
      - KUBECONFIG=/root/.kube/config

    volumes:
      - ./data:/data
      # Si tienes tu kubeconfig de sammcore montado en ~/.kube/config en Windows:
      - ~/.kube:/root/.kube:ro
    networks:
      - deployer-net

  deployer-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=/api
    container_name: deployer-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - deployer-backend
    networks:
      - deployer-net

networks:
  deployer-net:
    driver: bridge
