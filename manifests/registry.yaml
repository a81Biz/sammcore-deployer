apiVersion: v1
kind: Namespace
metadata:
  name: sammcore-registry
  labels:
    app.kubernetes.io/managed-by: sammcore-deployer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: sammcore-registry
  labels:
    app.kubernetes.io/managed-by: sammcore-deployer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: sammcore-registry
  labels:
    app.kubernetes.io/managed-by: sammcore-deployer
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: sammcore-deployer
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: sammcore-registry
  labels:
    app.kubernetes.io/managed-by: sammcore-deployer
    app: registry
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: registry
---
apiVersion: v1
kind: Service
metadata:
  name: registry-nodeport
  namespace: sammcore-registry
  labels:
    app.kubernetes.io/managed-by: sammcore-deployer
    app: registry
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      name: http
  selector:
    app: registry
