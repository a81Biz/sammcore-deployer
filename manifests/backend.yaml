apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer-backend
  namespace: deployer
  labels:
    app: deployer-backend
spec:
  replicas: 1
  strategy:
    type: Recreate # Garantiza un único pod escribiendo sobre el PVC /data
  selector:
    matchLabels:
      app: deployer-backend
  template:
    metadata:
      labels:
        app: deployer-backend
    spec:
      serviceAccountName: deployer-sa
      containers:
        - name: backend
          image: ghcr.io/a81biz/sammcore-deployer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/data"
            - name: ALLOWED_ORIGINS
              value: "https://deployer.sammcore.local,http://localhost:5173"
            - name: DEPLOYER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deployer-secrets
                  key: DEPLOYER_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deployer-secrets
                  key: GITHUB_TOKEN
                  optional: true
            - name: SUPABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: deployer-secrets
                  key: SUPABASE_HOST
            - name: SUPABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: deployer-secrets
                  key: SUPABASE_PORT
            - name: SUPABASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployer-secrets
                  key: SUPABASE_POSTGRES_PASSWORD
          volumeMounts:
            - name: data-volume
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 250Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 2Gi
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: deployer-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: deployer-backend
  namespace: deployer
  labels:
    app: deployer-backend
spec:
  type: ClusterIP
  selector:
    app: deployer-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
