apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer-backend
  namespace: deployer
  labels:
    app: deployer-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployer-backend
  template:
    metadata:
      labels:
        app: deployer-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/a81biz/sammcore-deployer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deployer-backend
  namespace: deployer
  labels:
    app: deployer-backend
spec:
  type: ClusterIP
  selector:
    app: deployer-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
