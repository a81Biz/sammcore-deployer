apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-sa
  namespace: deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sammcore-deployer-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - secrets
      - configmaps
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      - pods
      - pods/log
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sammcore-deployer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sammcore-deployer-role
subjects:
  - kind: ServiceAccount
    name: deployer-sa
    namespace: deployer
