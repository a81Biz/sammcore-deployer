apiVersion: v1
kind: Secret
metadata:
  name: deployer-secrets
  namespace: deployer
type: Opaque
stringData:
  DEPLOYER_API_KEY: "cambiar-por-token-criptografico-seguro"
  GITHUB_TOKEN: "" # Opcional: token para aumentar rate limit de GitHub API
  SUPABASE_HOST: "postgres.supabase.svc.cluster.local"
  SUPABASE_PORT: "5432"
  SUPABASE_POSTGRES_PASSWORD: "password-del-secret-de-supabase"
