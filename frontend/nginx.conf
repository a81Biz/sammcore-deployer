server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: cualquier ruta que no sea archivo estático retorna index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso opcional hacia el backend si se accede en el mismo contenedor
    location /api/ {
        proxy_pass http://deployer-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
